<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="暗記カード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">

<title>予備試験 暗記カード · Anki Web</title>
<style>
:root{
  --bg:#0b1220; --bg2:#0f172a; --panel:#151f33; --panel2:#1b2740;
  --text:#e8eef7; --muted:#8ea0bb; --line:#26344f;
  --brand:#2dd4bf; --brand2:#0ea5e9; --grad:linear-gradient(135deg,#0d9488,#0369a1);
  --again:#e11d48; --hard:#f59e0b; --good:#16a34a; --easy:#0ea5e9;
  --new:#38bdf8; --learn:#f472b6; --due:#34d399;
  --shadow:0 14px 40px rgba(0,0,0,.38);
}
html.light{
  --bg:#eef2f8; --bg2:#e6ecf5; --panel:#ffffff; --panel2:#f4f7fb;
  --text:#152033; --muted:#64748b; --line:#dde5ef;
  --shadow:0 10px 30px rgba(20,40,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 font-size:15px;line-height:1.65;display:flex;flex-direction:column;transition:background .25s,color .25s}
button{font-family:inherit}
.app{width:100%;max-width:780px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 96px;flex:1;display:flex;flex-direction:column;gap:14px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--grad);flex:0 0 auto;box-shadow:0 0 12px var(--brand)}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:11px;
 width:38px;height:38px;font-size:16px;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- generic ---------- */
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:9px 14px;
 font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(13,148,136,.3)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;
 padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
 background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.new{color:var(--new);border-color:color-mix(in srgb,var(--new) 45%,transparent)}
.chip.learn{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 45%,transparent)}
.chip.due{color:var(--due);border-color:color-mix(in srgb,var(--due) 45%,transparent)}

/* ---------- deck list ---------- */
.deck{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel);
 border:1px solid var(--line);cursor:pointer;transition:.15s;margin-bottom:9px}
.deck:hover{border-color:var(--brand);transform:translateY(-1px)}
.deck .nm{flex:1;min-width:0}
.deck .nm b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .nm span{font-size:11.5px;color:var(--muted)}
.deck .counts{display:flex;gap:6px;flex:0 0 auto}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:7px;display:flex}
.bar i{display:block;height:100%}
.bar i.b-new{background:var(--new)} .bar i.b-learn{background:var(--learn)}
.bar i.b-young{background:#a3e635} .bar i.b-mature{background:var(--good)}

/* ---------- study ---------- */
.studyhead{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pbar{height:5px;border-radius:99px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
.scene{perspective:1600px;min-height:340px;display:flex}
.flip{position:relative;width:100%;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.4,.15,.2,1);cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
 padding:42px 22px 46px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);overflow:auto}
.face .tag{position:absolute;top:13px;left:18px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;opacity:.7;text-transform:uppercase}
.face .hint{position:absolute;bottom:13px;left:0;right:0;text-align:center;font-size:11px;opacity:.6}
.front{background:linear-gradient(155deg,#0369a1,#1e3a8a);color:#fff}
.back{background:linear-gradient(155deg,#0f766e,#134e4a);color:#fff;transform:rotateY(180deg)}
html.light .front{background:linear-gradient(155deg,#0284c7,#1d4ed8)}
html.light .back{background:linear-gradient(155deg,#0d9488,#115e59)}
.qtext{font-size:19px;font-weight:700;line-height:1.6;text-align:center;white-space:pre-wrap}
.atext{font-size:17.5px;font-weight:700;line-height:1.7;white-space:pre-wrap}
.anote{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);font-size:13px;font-weight:400;opacity:.9;white-space:pre-wrap}
.aq{font-size:12.5px;opacity:.72;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);white-space:pre-wrap}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:none;border-radius:13px;padding:11px 4px;color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;
 display:flex;flex-direction:column;gap:2px;align-items:center;transition:.15s}
.grades button:hover{filter:brightness(1.12);transform:translateY(-1px)}
.grades button small{font-size:10.5px;font-weight:600;opacity:.85}
.g1{background:var(--again)} .g2{background:var(--hard)} .g3{background:var(--good)} .g4{background:var(--easy)}
.showbtn{width:100%;border:none;border-radius:13px;padding:13px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.donebox{text-align:center;padding:38px 18px}
.donebox .big{font-size:44px}

/* ---------- browse ---------- */
.brow{padding:11px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px;cursor:pointer}
.brow:hover{border-color:var(--brand)}
.brow .q{font-size:14px;font-weight:600}
.brow .a{font-size:12.5px;color:var(--muted);margin-top:3px;display:none;white-space:pre-wrap}
.brow.open .a{display:block}
.brow .meta{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- stats ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--muted)}
.fc{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.fc div{flex:1;background:var(--grad);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.fclabels{display:flex;gap:3px;font-size:9.5px;color:var(--muted);margin-top:4px}
.fclabels span{flex:1;text-align:center}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--panel) 92%,transparent);
 backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;
 padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:40}
nav .inner{width:100%;max-width:780px;display:flex}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;
 padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav button em{font-style:normal;font-size:18px;line-height:1}
nav button.active{color:var(--brand)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(3,8,18,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:620px;
 max-height:86vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal p.sub{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.updbar{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--grad);color:#fff;
 padding:calc(9px + env(safe-area-inset-top)) 14px 9px;font-size:13px;font-weight:700;display:none;
 align-items:center;gap:10px;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.updbar.on{display:flex}
.updbar button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;
 border-radius:9px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--panel);border:1px solid var(--brand);
 color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);
 opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12px}
.hide{display:none!important}
@media(max-width:420px){ .qtext{font-size:17px} .atext{font-size:16px} .grid4{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="dot"></span><div>予備試験 暗記カード<small id="subttl">免疫学 · 解剖学</small></div></div>
    <button class="iconbtn" id="btnTheme" title="テーマ">🌓</button>
    <button class="iconbtn" id="btnSet" title="設定・管理">⚙</button>
  </header>
  <div id="view"></div>
</div>
<nav><div class="inner">
  <button data-v="home" class="active"><em>🏠</em>ホーム</button>

  <button data-v="browse"><em>🔍</em>一覧</button>
  <button data-v="stats"><em>📊</em>統計</button>
</div></nav>
<div class="updbar" id="updbar">新しいバージョンがあります<button id="updbtn">今すぐ更新</button></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const CARD_DATA = `
免疫学::01 MHC・抗原処理	MHC class I に対応する HLA 分子は？	HLA-A / HLA-B / HLA-C	非古典的 class I：HLA-E / F / G	MHC,構造

<script>
/* ============================================================
   予備試験 暗記カード — 単一ファイル Anki（SM-2 間隔反復）
   カードデータは下の CARD_DATA に TSV 形式で埋め込まれている。
   deck \t front \t back \t note \t tags
   ============================================================ */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return MEM[k]!==undefined?MEM[k]:d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ MEM[k]=v; } }
};
const MEM = {};
const KEY = { prog:'yb_prog_v1', user:'yb_usercards_v1', cfg:'yb_cfg_v1', log:'yb_log_v1', daily:'yb_daily_v1' };

/* ---------- utils ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY = 86400000, MIN = 60000;
function hash(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(36); }
/* カード ID は「科目（デッキ最上位）＋表の文言」から作る。
   → サブデッキ名を並べ替えたり 01/02… の番号を振り直しても学習進捗は失われない。 */
function cid(d,q){ return hash(String(d||'').split('::')[0]+'|'+String(q||'')); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtIv(days){ if(days<1) return Math.max(1,Math.round(days*24*60))+'分'; if(days<30) return Math.round(days)+'日'; if(days<365) return (days/30).toFixed(1)+'ヶ月'; return (days/365).toFixed(1)+'年'; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1900); }

/* ---------- parse cards ---------- */
function parseTSV(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim()||line.trim().startsWith('#')) return;
    const p=line.split('\t');
    if(p.length<3) return;
    const c={ d:(p[0]||'その他').trim(), q:(p[1]||'').trim(), a:(p[2]||'').trim(), n:(p[3]||'').trim(), t:(p[4]||'').trim() };
    if(!c.q||!c.a) return;
    c.id=cid(c.d,c.q);
    out.push(c);
  });
  return out;
}
let CARDS=[], BYID={};
function rebuild(){
  const base = parseTSV(CARD_DATA);
  const user = LS.get(KEY.user,[]);
  const seen = {}; CARDS=[];
  base.concat(user).forEach(c=>{ c.id=cid(c.d,c.q); if(seen[c.id]) return; seen[c.id]=1; CARDS.push(c); });
  BYID={}; CARDS.forEach(c=>BYID[c.id]=c);
}

/* ---------- state ---------- */
let P = LS.get(KEY.prog,{});          // id -> {s,due,iv,ef,r,l,k,sus}
let CFG = Object.assign({ newPerDay:20, revPerDay:200, order:'seq', theme:'dark', deck:'', flipHint:true }, LS.get(KEY.cfg,{}));
let LOG = LS.get(KEY.log,[]);
let DAILY = LS.get(KEY.daily,{d:today(),n:0,r:0});
function saveP(){ LS.set(KEY.prog,P); }
function saveCfg(){ LS.set(KEY.cfg,CFG); }
function checkDay(){ if(DAILY.d!==today()){ DAILY={d:today(),n:0,r:0}; LS.set(KEY.daily,DAILY);} }
function st(id){ return P[id]||{s:0,due:0,iv:0,ef:2.5,r:0,l:0,k:0}; }

/* ---------- scheduling (SM-2 + learning steps) ---------- */
const STEPS=[1,10]; // minutes
function answer(id,g){
  checkDay();
  const now=Date.now(); let c=Object.assign({s:0,due:0,iv:0,ef:2.5,r:0,l:0,k:0}, P[id]||{});
  const wasNew = c.s===0;
  c.r++;
  if(c.s===0||c.s===1){                    // new / learning
    if(g===1){ c.k=0; c.due=now+STEPS[0]*MIN; c.s=1; }
    else if(g===2){ c.due=now+6*MIN; c.s=1; }
    else if(g===3){ if(c.k>=STEPS.length-1){ c.s=2; c.iv=1; c.due=now+DAY; } else { c.k++; c.due=now+STEPS[c.k]*MIN; c.s=1; } }
    else { c.s=2; c.iv=4; c.due=now+4*DAY; }
    if(wasNew) DAILY.n++;
  } else if(c.s===2){                      // review
    if(g===1){ c.l++; c.ef=Math.max(1.3,c.ef-0.2); c.s=3; c.k=0; c.pend=Math.max(1,c.iv*0.5); c.due=now+10*MIN; }
    else{
      if(g===2){ c.iv=Math.max(1,c.iv*1.2); c.ef=Math.max(1.3,c.ef-0.15); }
      else if(g===3){ c.iv=Math.max(1,c.iv*c.ef); }
      else { c.iv=Math.max(1,c.iv*c.ef*1.3); c.ef=Math.min(2.9,c.ef+0.15); }
      c.iv=Math.min(c.iv,730); c.due=now+c.iv*DAY;
    }
    DAILY.r++;
  } else {                                 // relearning
    if(g===1){ c.due=now+10*MIN; }
    else if(g===2){ c.due=now+15*MIN; }
    else { c.s=2; c.iv=Math.max(1,c.pend||1); c.due=now+c.iv*DAY; delete c.pend; }
    DAILY.r++;
  }
  P[id]=c; saveP(); LS.set(KEY.daily,DAILY);
  LOG.push({t:now,i:id,g:g}); if(LOG.length>8000) LOG=LOG.slice(-6000); LS.set(KEY.log,LOG);
}
function nextIvLabel(id,g){
  const c=Object.assign({s:0,iv:0,ef:2.5,k:0},P[id]||{});
  if(c.s===0||c.s===1){ if(g===1) return '1分'; if(g===2) return '6分'; if(g===3) return c.k>=STEPS.length-1?'1日':'10分'; return '4日'; }
  if(c.s===2){ if(g===1) return '10分'; if(g===2) return fmtIv(Math.max(1,c.iv*1.2)); if(g===3) return fmtIv(Math.max(1,c.iv*c.ef)); return fmtIv(Math.max(1,c.iv*c.ef*1.3)); }
  if(g===1) return '10分'; if(g===2) return '15分'; return fmtIv(Math.max(1,c.pend||1));
}

/* ---------- decks ---------- */
function deckList(){
  const m={};
  CARDS.forEach(c=>{ (m[c.d]=m[c.d]||[]).push(c); });
  return Object.keys(m).sort().map(k=>({name:k,cards:m[k]}));
}
function inDeck(c,dk){ return !dk || c.d===dk || c.d.indexOf(dk+'::')===0; }
function counts(cards){
  const now=Date.now(); let n=0,l=0,d=0,mat=0;
  cards.forEach(c=>{ const s=st(c.id); if(s.sus) return;
    if(s.s===0) n++; else if(s.s===1||s.s===3){ if(s.due<=now) l++; } else if(s.due<=now) d++;
    if(s.s===2&&s.iv>=21) mat++; });
  return {n,l,d,mat};
}

/* ---------- queue ---------- */
let QUEUE=[], CUR=null, SHOWN=false, SESSION={done:0,total:0}, LAST=null;
function buildQueue(){
  checkDay();
  const now=Date.now(), dk=CFG.deck;
  const pool=CARDS.filter(c=>inDeck(c,dk)&&!st(c.id).sus);
  let rev=[],lrn=[],nw=[];
  pool.forEach(c=>{ const s=st(c.id);
    if(s.s===0) nw.push(c);
    else if(s.s===1||s.s===3){ if(s.due<=now+MIN*0.5) lrn.push(c); }
    else if(s.due<=now) rev.push(c);
  });
  rev.sort((a,b)=>st(a.id).due-st(b.id).due);
  lrn.sort((a,b)=>st(a.id).due-st(b.id).due);
  if(CFG.order==='rand'){ shuffle(nw); shuffle(rev); }
  rev=rev.slice(0,Math.max(0,CFG.revPerDay-DAILY.r));
  nw =nw.slice(0,Math.max(0,CFG.newPerDay-DAILY.n));
  // interleave: 復習を主軸に、新規を等間隔で差し込む
  const out=[...lrn]; const step = nw.length? Math.max(1,Math.floor(rev.length/(nw.length+1))||1):1;
  let ni=0;
  for(let i=0;i<rev.length;i++){ out.push(rev[i]); if(ni<nw.length && (i+1)%step===0) out.push(nw[ni++]); }
  while(ni<nw.length) out.push(nw[ni++]);
  QUEUE=out; SESSION={done:0,total:out.length};
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }

function cChip(c){ return `<span class="chip new">${c.n}</span><span class="chip learn">${c.l}</span><span class="chip due">${c.d}</span>`; }
function barHTML(cards){

function vStudy(){

     </div></div></div>

     <span class="sp"></span>
     <span style="font-size:11px;color:var(--muted)">EF ${s.ef.toFixed(2)} · ${s.r}回 · ${s.iv?fmtIv(s.iv):'—'}</span>
   </div>`;
  const ctrl=$('#ctrl');

    ctrl.innerHTML=`<button class="showbtn" id="show">答えを見る　（Space）</button>`;
    $('#show').onclick=doShow;
  } else {
    ctrl.innerHTML=`<div class="grades">
      <button class="g1" data-g="1">もう一度<small>${nextIvLabel(c.id,1)}</small></button>
      <button class="g2" data-g="2">難しい<small>${nextIvLabel(c.id,2)}</small></button>
      <button class="g3" data-g="3">普通<small>${nextIvLabel(c.id,3)}</small></button>
      <button class="g4" data-g="4">簡単<small>${nextIvLabel(c.id,4)}</small></button></div>`;

  }
  fitScene();
  $('#flip').onclick=()=>{ if(!SHOWN) doShow(); };
  $('#sus').onclick=()=>{ const x=Object.assign({s:0,due:0,iv:0,ef:2.5,r:0,l:0,k:0},P[c.id]||{}); x.sus=1; P[c.id]=x; saveP(); toast('このカードを一時停止しました'); CUR=null; vStudy(); };

function fitScene(){
  const sc=document.querySelector('.scene'); if(!sc) return;
  const f=sc.querySelector('.front'), b=sc.querySelector('.back');
  const h=Math.max(300, f.scrollHeight+4, b.scrollHeight+4);
  sc.style.minHeight=Math.min(h, Math.round(window.innerHeight*0.62))+'px';
}
function doShow(){ SHOWN=true; vStudy(); }
function grade(g){
  const c=CUR; const before=JSON.parse(JSON.stringify(P[c.id]||null));
  answer(c.id,g);
  LAST={id:c.id,before:before,card:c,dn:DAILY.n,dr:DAILY.r};
  SESSION.done++;
  const s=st(c.id);
  if(s.s===1||s.s===3){ // 学習中は 10 分以内なら同一セッション内で再出題
    if(s.due-Date.now() < 11*MIN) QUEUE.push(c);
  }
  CUR=null; SHOWN=false; vStudy();
}
function undo(){
  if(!LAST) return;
  if(LAST.before===null) delete P[LAST.id]; else P[LAST.id]=LAST.before;
  saveP(); LOG.pop(); LS.set(KEY.log,LOG);
  QUEUE=QUEUE.filter(x=>x.id!==LAST.id);
  if(CUR) QUEUE.unshift(CUR);
  CUR=LAST.card; SHOWN=true; SESSION.done=Math.max(0,SESSION.done-1);
  LAST=null; toast('直前の回答を取り消しました'); vStudy();
}

function vBrowse(){

        ${[['all','状態：すべて'],['new','未学習'],['learn','学習中'],['due','期限切れ'],['mature','習得済み'],['sus','一時停止']].map(o=>`<option value="${o[0]}" ${BF===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
    </div></div>`;
  const now=Date.now();
  const q=BQ.trim().toLowerCase();
  let list=CARDS.filter(c=>{
    if(CFG.deck && !inDeck(c,CFG.deck)) return false;
    const s=st(c.id);
    if(BF==='new'&&s.s!==0) return false;
    if(BF==='learn'&&!(s.s===1||s.s===3)) return false;
    if(BF==='due'&&!(s.s===2&&s.due<=now)) return false;
    if(BF==='mature'&&!(s.s===2&&s.iv>=21)) return false;
    if(BF==='sus'&&!s.sus) return false;
    if(BF!=='sus'&&s.sus) return false;
    if(q && (c.q+' '+c.a+' '+c.n+' '+c.t).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  h+=`<div style="margin-top:12px;font-size:12px;color:var(--muted);padding-left:4px">${list.length} 件</div><div id="rows" style="margin-top:8px"></div>`;

  $('#view').innerHTML=h;

  rows.innerHTML=list.slice(0,BLIMIT).map(c=>{
    const s=st(c.id);
    const badge = s.sus?'<span class="chip">停止</span>': s.s===0?'<span class="chip new">未</span>':(s.s===1||s.s===3)?'<span class="chip learn">学</span>':(s.iv>=21?'<span class="chip due">熟</span>':'<span class="chip due">復</span>');
    return `<div class="brow" data-id="${c.id}"><div class="q">${esc(c.q)}</div>

      <div class="meta">${badge}<span>${esc(c.d)}</span>${c.t?`<span>🏷 ${esc(c.t)}</span>`:''}${s.iv?`<span>間隔 ${fmtIv(s.iv)}</span>`:''}</div></div>`;
  }).join('');
  rows.querySelectorAll('.brow').forEach(el=>el.onclick=()=>el.classList.toggle('open'));
  $('#q').oninput=e=>{ BQ=e.target.value; BLIMIT=120; clearTimeout(window._bt); window._bt=setTimeout(()=>{const p=e.target.selectionStart;vBrowse();const i=$('#q');i.focus();i.setSelectionRange(p,p);},220); };
  $('#dk').onchange=e=>{ CFG.deck=e.target.value; saveCfg(); BLIMIT=120; vBrowse(); };
  $('#ft').onchange=e=>{ BF=e.target.value; BLIMIT=120; vBrowse(); };
  if($('#more')) $('#more').onclick=()=>{ BLIMIT+=200; vBrowse(); };
}

  const nw=act.filter(x=>st(x.id).s===0).length;
  // forecast 14 days
  const fc=new Array(14).fill(0);
  act.forEach(x=>{ const s=st(x.id); if(s.s!==2) return; const d=Math.floor((s.due-now)/DAY); if(d>=0&&d<14) fc[d]++; else if(d<0) fc[0]++; });
  const mx=Math.max(1,...fc);
  // 7-day activity
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(now-i*DAY); days.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
  const dayc={}; days.forEach(d=>dayc[d]=0);

      <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#a3e635"></i> 定着中 ${young}</span>
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--learn)"></i> 学習中 ${learn}</span>
      <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--new)"></i> 未学習 ${nw}</span>
    </div></div>
  <div class="card-panel" style="margin-top:14px"><h2>今後 14 日の復習予定</h2>
    <div class="fc">${fc.map(v=>`<div style="height:${v/mx*100}%" title="${v}枚"></div>`).join('')}</div>
    <div class="fclabels">${fc.map((v,i)=>`<span>${i%2===0?(i===0?'今日':i+'d'):''}</span>`).join('')}</div></div>
  <div class="card-panel" style="margin-top:14px"><h2>直近 7 日の回答数</h2>
    <div class="fc">${days.map(d=>`<div style="height:${dayc[d]/mx2*100}%" title="${dayc[d]}回"></div>`).join('')}</div>
    <div class="fclabels">${days.map(d=>`<span>${d.slice(5).replace('-','/')}</span>`).join('')}</div></div>`;
}

   <p style="font-size:12px;color:var(--muted);margin:0">
     バージョン <b>${APP_VERSION}</b>　·　収録 <b>${CARDS.length}</b> 枚<br>
     ${location.protocol.indexOf('http')===0 ? '配信元：'+esc(location.origin)+'（オフライン利用可）' : 'ローカルファイルとして実行中'}
   </p>
   <div class="row" style="margin-top:18px"><span class="sp"></span><button class="btn primary" id="close">閉じる</button></div>`;
  $('#mask').classList.add('on');
  const close=()=>{ CFG.newPerDay=Math.max(0,+$('#np').value||0); CFG.revPerDay=Math.max(0,+$('#rp').value||0); saveCfg(); $('#mask').classList.remove('on'); render(); };
  $('#close').onclick=close;
  $('#doImp').onclick=()=>{ importText($('#imp').value); close(); };
  $('#pickFile').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ importText(r.result); close(); }; r.readAsText(f); };
  $('#expCards').onclick=()=>dl('cards_all.tsv', CARDS.map(c=>[c.d,c.q,c.a,c.n,c.t].join('\t')).join('\n'));
  $('#expProg').onclick=()=>dl('anki_progress_'+today()+'.json', JSON.stringify({prog:P,log:LOG,daily:DAILY,user:LS.get(KEY.user,[])}));
  $('#impProg').onclick=()=>$('#pfile').click();
  $('#pfile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result); if(j.prog){P=j.prog;saveP();} if(j.log){LOG=j.log;LS.set(KEY.log,LOG);} if(j.daily){DAILY=j.daily;LS.set(KEY.daily,DAILY);} if(j.user){LS.set(KEY.user,j.user);rebuild();} toast('進捗を復元しました'); close(); }catch(err){ toast('ファイルを読めませんでした'); } };
    r.readAsText(f); };
  $('#rsDaily').onclick=()=>{ DAILY={d:today(),n:0,r:0}; LS.set(KEY.daily,DAILY); toast('本日のカウントをリセット'); close(); };
  $('#rsUser').onclick=()=>{ if(confirm('取り込んだ追加カードを削除しますか？（内蔵カードは残ります）')){ LS.set(KEY.user,[]); rebuild(); toast('追加カードを削除しました'); close(); } };
  $('#rsAll').onclick=()=>{ if(confirm('すべての学習進捗を消去しますか？この操作は元に戻せません。')){ P={};LOG=[];DAILY={d:today(),n:0,r:0}; saveP();LS.set(KEY.log,LOG);LS.set(KEY.daily,DAILY); toast('進捗を消去しました'); close(); } };
}
function importText(txt){
  if(!txt||!txt.trim()){ toast('内容がありません'); return; }
  let add=[];
  const t=txt.trim();
  if(t[0]==='['||t[0]==='{'){
    try{ const j=JSON.parse(t); const arr=Array.isArray(j)?j:(j.cards||[]);
      add=arr.map(o=>({d:o.d||o.deck||'その他',q:o.q||o.front||'',a:o.a||o.back||'',n:o.n||o.note||'',t:o.t||o.tags||''})).filter(o=>o.q&&o.a);
    }catch(e){ toast('JSON を解析できません'); return; }
  } else {
    let s=t; if(s.indexOf('\t')<0 && s.indexOf(',')>0) s=s.split(/\r?\n/).map(l=>l.split(',').join('\t')).join('\n');
    add=parseTSV(s);
  }
  if(!add.length){ toast('有効なカードが見つかりません'); return; }
  add.forEach(c=>c.id=cid(c.d,c.q));
  const user=LS.get(KEY.user,[]);
  const map={}; user.forEach(c=>map[cid(c.d,c.q)]=c);
  let nAdd=0,nUp=0;
  add.forEach(c=>{ if(map[c.id]) nUp++; else nAdd++; map[c.id]=c; });
  LS.set(KEY.user,Object.values(map));
  rebuild();
  toast(`取り込み完了：新規 ${nAdd} 枚 / 更新 ${nUp} 枚`);
}
function dl(name,txt){
  const b=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(/input|textarea|select/i.test((e.target.tagName||''))) return;
  if(VIEW!=='study') { if(e.key==='s'){go('study');} return; }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(!SHOWN&&CUR) doShow(); else if(CUR) grade(3); return; }
  if(SHOWN&&CUR&&['1','2','3','4'].includes(e.key)){ e.preventDefault(); grade(+e.key); }
  if(e.key==='z'&&LAST) undo();
});

/* ---------- PWA / Service Worker ---------- */
const APP_VERSION = '2026-08-18 (363枚)';
function initPWA(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol.indexOf('http')!==0) return;   // file:// では登録しない
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // 待機中の新バージョンがあれば知らせる
    const notify = w => {
      if(!w) return;
      const bar=$('#updbar'); if(!bar) return;
      bar.classList.add('on');
      document.body.style.paddingTop = bar.offsetHeight+'px';   // ヘッダーに被らないよう押し下げる
      $('#updbtn').onclick=()=>{ $('#updbtn').textContent='更新中…'; w.postMessage('skipWaiting'); };
    };
    if(reg.waiting) notify(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;
      if(!w) return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed' && navigator.serviceWorker.controller) notify(reg.waiting||w);
      });
    });
    // 起動時と復帰時に更新を確認
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return; reloading=true; location.reload();
  });
}

/* ---------- boot ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='study'&&VIEW!=='study') startStudy(); else go(b.dataset.v); });
$('#btnSet').onclick=openSettings;
$('#mask').onclick=e=>{ if(e.target===$('#mask')) $('#mask').classList.remove('on'); };
$('#btnTheme').onclick=()=>{ const l=document.documentElement.classList.toggle('light'); document.documentElement.classList.toggle('dark',!l); CFG.theme=l?'light':'dark'; saveCfg(); };
if(CFG.theme==='light'){ document.documentElement.classList.add('light'); document.documentElement.classList.remove('dark'); }
checkDay(); rebuild(); go('home'); initPWA();
$('#subttl').textContent = [...new Set(CARDS.map(c=>c.d.split('::')[0]))].join(' · ');
</script>
