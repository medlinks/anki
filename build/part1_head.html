<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="暗記カード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>予備試験 暗記カード · Anki Web</title>
<style>
:root{
  --bg:#0b1220; --bg2:#0f172a; --panel:#151f33; --panel2:#1b2740;
  --text:#e8eef7; --muted:#8ea0bb; --line:#26344f;
  --brand:#2dd4bf; --brand2:#0ea5e9; --grad:linear-gradient(135deg,#0d9488,#0369a1);
  --again:#e11d48; --hard:#f59e0b; --good:#16a34a; --easy:#0ea5e9;
  --new:#38bdf8; --learn:#f472b6; --due:#34d399;
  --shadow:0 14px 40px rgba(0,0,0,.38);
}
html.light{
  --bg:#eef2f8; --bg2:#e6ecf5; --panel:#ffffff; --panel2:#f4f7fb;
  --text:#152033; --muted:#64748b; --line:#dde5ef;
  --shadow:0 10px 30px rgba(20,40,80,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 font-size:15px;line-height:1.65;display:flex;flex-direction:column;transition:background .25s,color .25s}
button{font-family:inherit}
.app{width:100%;max-width:780px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 96px;flex:1;display:flex;flex-direction:column;gap:14px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px}
.logo{font-size:17px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--grad);flex:0 0 auto;box-shadow:0 0 12px var(--brand)}
.logo small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:11px;
 width:38px;height:38px;font-size:16px;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- generic ---------- */
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:9px 14px;
 font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 6px 18px rgba(13,148,136,.3)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;
 padding:10px 12px;font-size:14px;font-family:inherit;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
 background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.new{color:var(--new);border-color:color-mix(in srgb,var(--new) 45%,transparent)}
.chip.learn{color:var(--learn);border-color:color-mix(in srgb,var(--learn) 45%,transparent)}
.chip.due{color:var(--due);border-color:color-mix(in srgb,var(--due) 45%,transparent)}

/* ---------- deck list ---------- */
.deck{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel);
 border:1px solid var(--line);cursor:pointer;transition:.15s;margin-bottom:9px}
.deck:hover{border-color:var(--brand);transform:translateY(-1px)}
.deck .nm{flex:1;min-width:0}
.deck .nm b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .nm span{font-size:11.5px;color:var(--muted)}
.deck .counts{display:flex;gap:6px;flex:0 0 auto}
.linkcard{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--panel);
 border:1px solid var(--line);cursor:pointer;transition:.15s;margin-bottom:9px;text-decoration:none;color:inherit}
.linkcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.linkcard .nm b{display:block;font-size:14.5px;font-weight:700}
.linkcard .nm span{font-size:11.5px;color:var(--muted)}
.linkcard .arrow{color:var(--muted);font-size:20px;flex:0 0 auto}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:7px;display:flex}
.bar i{display:block;height:100%}
.bar i.b-new{background:var(--new)} .bar i.b-learn{background:var(--learn)}
.bar i.b-young{background:#a3e635} .bar i.b-mature{background:var(--good)}

/* ---------- study ---------- */
.studyhead{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pbar{height:5px;border-radius:99px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
.scene{perspective:1600px;min-height:340px;display:flex}
.flip{position:relative;width:100%;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.4,.15,.2,1);cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
 padding:42px 22px 46px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);overflow:auto}
.face .tag{position:absolute;top:13px;left:18px;font-size:10.5px;font-weight:800;letter-spacing:1.2px;opacity:.7;text-transform:uppercase}
.face .hint{position:absolute;bottom:13px;left:0;right:0;text-align:center;font-size:11px;opacity:.6}
.front{background:linear-gradient(155deg,#0369a1,#1e3a8a);color:#fff}
.back{background:linear-gradient(155deg,#0f766e,#134e4a);color:#fff;transform:rotateY(180deg)}
html.light .front{background:linear-gradient(155deg,#0284c7,#1d4ed8)}
html.light .back{background:linear-gradient(155deg,#0d9488,#115e59)}
.qtext{font-size:19px;font-weight:700;line-height:1.6;text-align:center;white-space:pre-wrap}
.atext{font-size:17.5px;font-weight:700;line-height:1.7;white-space:pre-wrap}
.anote{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);font-size:13px;font-weight:400;opacity:.9;white-space:pre-wrap}
.aq{font-size:12.5px;opacity:.72;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);white-space:pre-wrap}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grades button{border:none;border-radius:13px;padding:11px 4px;color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;
 display:flex;flex-direction:column;gap:2px;align-items:center;transition:.15s}
.grades button:hover{filter:brightness(1.12);transform:translateY(-1px)}
.grades button small{font-size:10.5px;font-weight:600;opacity:.85}
.g1{background:var(--again)} .g2{background:var(--hard)} .g3{background:var(--good)} .g4{background:var(--easy)}
.showbtn{width:100%;border:none;border-radius:13px;padding:13px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
.donebox{text-align:center;padding:38px 18px}
.donebox .big{font-size:44px}

/* ---------- browse ---------- */
.brow{padding:11px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px;cursor:pointer}
.brow:hover{border-color:var(--brand)}
.brow .q{font-size:14px;font-weight:600}
.brow .a{font-size:12.5px;color:var(--muted);margin-top:3px;display:none;white-space:pre-wrap}
.brow.open .a{display:block}
.brow .meta{font-size:10.5px;color:var(--muted);margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- stats ---------- */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.kpi span{font-size:10.5px;color:var(--muted)}
.fc{display:flex;align-items:flex-end;gap:3px;height:110px;margin-top:8px}
.fc div{flex:1;background:var(--grad);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.fclabels{display:flex;gap:3px;font-size:9.5px;color:var(--muted);margin-top:4px}
.fclabels span{flex:1;text-align:center}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--panel) 92%,transparent);
 backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;
 padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:40}
nav .inner{width:100%;max-width:780px;display:flex}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;
 padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav button em{font-style:normal;font-size:18px;line-height:1}
nav button.active{color:var(--brand)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(3,8,18,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.mask.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:620px;
 max-height:86vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal p.sub{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
.updbar{position:fixed;left:0;right:0;top:0;z-index:70;background:var(--grad);color:#fff;
 padding:calc(9px + env(safe-area-inset-top)) 14px 9px;font-size:13px;font-weight:700;display:none;
 align-items:center;gap:10px;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.updbar.on{display:flex}
.updbar button{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;
 border-radius:9px;padding:5px 12px;font-size:12.5px;font-weight:800;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--panel);border:1px solid var(--brand);
 color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);
 opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
code{background:var(--panel2);padding:1px 5px;border-radius:5px;font-size:12px}
.hide{display:none!important}
@media(max-width:420px){ .qtext{font-size:17px} .atext{font-size:16px} .grid4{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="dot"></span><div>予備試験 暗記カード<small id="subttl">免疫学 · 解剖学</small></div></div>
    <button class="iconbtn" id="btnTheme" title="テーマ">🌓</button>
    <button class="iconbtn" id="btnSet" title="設定・管理">⚙</button>
  </header>
  <div id="view"></div>
</div>
<nav><div class="inner">
  <button data-v="home" class="active"><em>🏠</em>ホーム</button>
  <button data-v="study"><em>🎴</em>学習</button>
  <button data-v="browse"><em>🔍</em>一覧</button>
  <button data-v="stats"><em>📊</em>統計</button>
</div></nav>
<div class="updbar" id="updbar">新しいバージョンがあります<button id="updbtn">今すぐ更新</button></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
